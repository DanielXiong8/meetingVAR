name: smoke

on:
  push:
    branches: [main]
  pull_request:

jobs:
  model-free:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install package metadata
        run: python -m pip install -e . --no-deps

      - name: Run model-free regression tests
        run: python -m unittest discover -s tests -v

      - name: Compile source
        run: python -m compileall -q src tests

  simulation:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install isolated simulation dependencies
        run: python -m pip install -e . -r requirements-simulation.txt -r requirements-secrets.txt
      - name: Run all regressions, including actual CLI workflow
        run: python -m unittest discover -s tests -v
      - name: Run inspectable simulation
        run: python -m meetingvar.simulation --output data/simulation
