name: smoke

on:
  push:
    branches: [main]
  pull_request:

# Windows runners can default redirected Python output to cp1252. Chinese
# diagnostics must use the same UTF-8 encoding as the local verification logs.
env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  model-free:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install package metadata
        run: python -m pip install -e . --no-deps

      - name: Run model-free regression tests
        run: python scripts/run_local_checks.py --skip-simulation --isolated-cwd

      - name: Preserve verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-free-verification
          path: |
            data/verification/run_*/result.json
            data/verification/run_*/*.log

  simulation:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install isolated simulation dependencies
        run: python -m pip install -e . -r requirements-simulation.txt -r requirements-secrets.txt
      - name: Run all regressions, including actual CLI workflow
        run: python scripts/run_local_checks.py
      - name: Preserve verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulation-verification-${{ matrix.os }}
          path: |
            data/verification/run_*/result.json
            data/verification/run_*/*.log
            data/verification/run_*/simulation/run_*/result.json
            data/verification/run_*/simulation/run_*/simulation.log
