<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>meetingVAR</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="logodot"></span> meetingVAR <span class="ver" id="ver"></span></div>
  <div class="topbar-right">
    <span class="llm-pill" id="llmPill" title="本地 LLM 服务（选词人/语义层）">LLM ○</span>
    <span class="status-pill" id="statusPill">● 待机</span>
  </div>
</header>

<div class="app">
  <nav class="side">
    <button class="navbtn active" data-page="home">● 主页</button>
    <button class="navbtn" data-page="project">▤ 项目</button>
    <button class="navbtn" data-page="library">▦ 会议库</button>
    <button class="navbtn" data-page="settings">⚙ 设置</button>
  </nav>

  <main>
    <!-- 主页 -->
    <section id="page-home" class="page active">
      <div class="card projectcard">
        <div class="pc-label">当前项目</div>
        <div class="pc-path" id="homeProject">（未选择——去「项目」页选一个文件夹）</div>
      </div>
      <div class="recrow">
        <button id="btnRec" class="recbtn"><span class="recdot"></span><span id="recLabel">开始会议</span></button>
        <div class="recside">
          <button id="btnVar" class="btn">手动 VAR（回车等价）</button>
          <button id="btnOpenOut" class="btn">打开产物文件夹</button>
          <button id="btnTf" class="btn" title="选一个录音/录像文件 → 讯飞录音文件转写（含说话人分离）→ 生成 <文件名>.transcript.txt">文件转写…</button>
        </div>
      </div>
      <div id="tfLine" class="muted" hidden></div>
      <div class="statusline">
        <span id="statTime">--</span>
        <span id="statHits">命中 0</span>
        <span id="statSpeakers">说话人 —</span>
      </div>
      <div class="card ticker">
        <div class="ticker-title">最近听到 <span class="muted">（转写实时流，仅本机）</span></div>
        <div id="ticker" class="ticker-body"></div>
      </div>
    </section>

    <!-- 项目页（读取文件夹） -->
    <section id="page-project" class="page">
      <div class="row">
        <button id="btnPick" class="btn btn-primary">选择项目文件夹…</button>
        <div class="path" id="projPath">未选择</div>
      </div>
      <div class="row">
        <label class="muted">或手动输入路径</label>
        <input id="projManual" class="input" placeholder="如：D:\项目\AI for ALS\数据处理与筛选">
        <button id="btnScanInput" class="btn">读取</button>
      </div>
      <div id="scanMeta" class="muted">读取后显示摘要（文档数 / 词表 / 跳过的非文本文件）；文件树在右侧</div>
      <div id="scanTerms" class="scan"></div>
      <button id="btnUseProject" class="btn btn-primary" disabled>用此项目开会 →</button>
    </section>

    <!-- 会议库（按项目分组；参照 ZCode 侧栏信息结构：项目 → 场次 → 详情） -->
    <section id="page-library" class="page">
      <div class="row">
        <button class="btn" onclick="refreshLibrary()">刷新</button>
        <span class="muted">按项目分组 · 点项目展开场次</span>
      </div>
      <div id="libGroups" class="lib-groups"></div>
      <div id="sessionDetail" class="detail card" hidden></div>
    </section>

    <!-- 设置 -->
    <section id="page-settings" class="page">
      <label class="field"><span>引擎 Python（meetingvar 所在环境）</span>
        <input id="cfgPy" class="input" placeholder="D:\miniconda3\envs\meetingvar\python.exe"></label>
      <label class="field"><span>仓库目录（引擎代码所在位置）</span>
        <input id="cfgRepo" class="input" placeholder="C:\Users\Lenovo\projects\meetingVAR"></label>
      <label class="field"><span>设备</span>
        <select id="cfgDevice" class="input">
          <option value="cuda">cuda（GPU，推荐）</option>
          <option value="cpu">cpu（无 GPU 时）</option>
        </select></label>
      <label class="field"><span>音频采集源</span>
        <select id="cfgSource" class="input">
          <option value="both">系统声音 + 麦克风（推荐：别人说的 + 你说的，两头都录）</option>
          <option value="loopback">仅系统声音（只听电脑外放/视频的声音）</option>
          <option value="mic">仅麦克风（只听现场/自己的声音）</option>
        </select></label>

      <h3 class="set-h">识别引擎（实时转写）</h3>
      <label class="field"><span>引擎</span>
        <select id="cfgAsr" class="input">
          <option value="local">本地 FunASR（推荐：离线可跑，带说话人分离）</option>
          <option value="xfyun">讯飞语音听写（云端：联网即用，无说话人分离→全场 spk?）</option>
        </select></label>
      <div class="row" id="xfyunRow">
        <input id="cfgXfyunDir" class="input" placeholder="讯飞控制台下载的文件夹（内含 语音听写 / 录音文件转写 子目录）">
        <button id="btnXfyunDir" class="btn">选择…</button>
        <button id="btnXfyunCheck" class="btn">检测</button>
      </div>
      <div id="xfyunResult" class="muted">讯飞文件夹选好后点「检测」：认领凭证并联网探活（密钥只读不显示）。</div>

      <h3 class="set-h">模型服务（LLM：选词人 / 语义层 / 纪要）</h3>
      <label class="field"><span>厂商</span>
        <select id="cfgProvider" class="input">
          <option value="local">本地模型（内置 llama.cpp 服务，离线免费）</option>
          <option value="custom">自定义 API（任意 OpenAI 兼容：DeepSeek / 通义 / OpenAI / 自建…）</option>
        </select></label>
      <div id="provLocal">
        <div class="row">
          <span id="llmStatus" class="muted">检测中…</span>
          <button id="btnLlmStart" class="btn">启动服务</button>
          <button id="btnLlmStop" class="btn">停止服务</button>
        </div>
        <label class="field"><span>模型 GGUF 路径（自动探测，可改）</span>
          <input id="cfgGguf" class="input" placeholder="D:\env\models\models\Qwen--Qwen3-4B-GGUF\...\Qwen3-4B-Q4_K_M.gguf"></label>
      </div>
      <div id="provCustom" hidden>
        <label class="field"><span>Base URL（OpenAI 兼容，通常以 /v1 结尾）</span>
          <input id="cfgBaseUrl" class="input" placeholder="https://api.deepseek.com/v1"></label>
        <label class="field"><span>模型名</span>
          <input id="cfgModel" class="input" placeholder="deepseek-chat"></label>
        <label class="field"><span>API Key（只存本机配置目录，不随纪要/仓库外发）</span>
          <input id="cfgApiKey" class="input" type="password" placeholder="sk-…"></label>
        <div class="row"><button id="btnTestLlm" class="btn">测试连接</button><span id="llmTestResult" class="muted"></span></div>
      </div>
      <label class="checkrow"><input type="checkbox" id="cfgUseLlm"> 开会时启用 LLM 语义层（本地厂商需服务在线）</label>

      <div class="row">
        <button id="btnTestEngine" class="btn">测试引擎</button>
        <button id="btnSaveCfg" class="btn btn-primary">保存</button>
        <button id="btnOpenCfg" class="btn">打开配置目录</button>
      </div>
      <div id="testResult" class="muted"></div>
    </section>
  </main>

  <!-- 右栏：项目文件树（工作区在中间；参照 ZCode 的侧栏信息结构） -->
  <aside class="rightpanel" id="rightPanel">
    <div class="rp-head">
      <span class="rp-title">项目文件</span>
      <span class="muted" id="treeStat"></span>
      <button class="btn rp-refresh" id="btnTreeRefresh" title="重新读取">↻</button>
    </div>
    <div class="rp-proj muted" id="rpProjName">（未选择项目）</div>
    <div class="tree-body" id="sideTree"><div class="muted" style="padding:4px 8px">在「项目」页选择文件夹后显示</div></div>
  </aside>
</div>

<!-- 说话人点名弹窗 -->
<div id="askModal" class="modal" hidden>
  <div class="modal-card card">
    <div class="modal-title">这位说话人是谁？</div>
    <div class="modal-sub" id="askSub"></div>
    <input id="askInput" class="input" placeholder="输入名字并回车（直接回车＝跳过；会记入声纹名册）">
    <div class="row end">
      <button id="btnAskSkip" class="btn">跳过</button>
      <button id="btnAskOk" class="btn btn-primary">确认</button>
    </div>
  </div>
</div>

<div id="toast" class="toast" hidden></div>
<script src="app.js"></script>
</body>
</html>
